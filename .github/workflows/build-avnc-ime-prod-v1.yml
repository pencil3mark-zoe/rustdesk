name: Build AVNC IME Fix APK

on:
  push:
    branches:
      - fix/avnc-ime-prod-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance repo
        uses: actions/checkout@v4

      - name: Checkout AVNC 3.3.1
        uses: actions/checkout@v4
        with:
          repository: gujjwal00/avnc
          ref: f30406514ef8880097e960da7dc1d8dc4c713d7f
          path: avnc-src
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Android IME patch
        run: |
          cd avnc-src
          git apply --check ../patches/avnc-ime-committext.patch
          git apply ../patches/avnc-ime-committext.patch
          sed -i 's#<string name="app_name" translatable="false">AVNC</string>#<string name="app_name" translatable="false">AVNC IME Fix</string>#' app/src/main/res/values/strings.xml
          git diff --check

      - name: Build installable debug APK
        run: |
          cd avnc-src
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../avnc-3.3.1-ime-fix-debug.apk
          cd ..
          sha256sum avnc-3.3.1-ime-fix-debug.apk | tee avnc-3.3.1-ime-fix-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avnc-3.3.1-ime-fix-debug
          path: |
            avnc-3.3.1-ime-fix-debug.apk
            avnc-3.3.1-ime-fix-debug.apk.sha256
          if-no-files-found: error