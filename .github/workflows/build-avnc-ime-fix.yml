name: Build AVNC 3.3.1 IME Fix APK

on:
  push:
    branches:
      - fix/avnc-ime-input
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout maintenance repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout pinned AVNC 3.3.1
        run: |
          git clone https://github.com/gujjwal00/avnc.git avnc
          cd avnc
          git checkout f30406514ef8880097e960da7dc1d8dc4c713d7f
          git submodule update --init --recursive

      - name: Apply Android IME committed-text fix
        run: |
          cd avnc
          git apply --check ../patches/avnc-3.3.1-ime-input.patch
          git apply ../patches/avnc-3.3.1-ime-input.patch
          git diff --check

      - name: Build debug-signed APK
        working-directory: avnc
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Package artifact
        run: |
          cp avnc/app/build/outputs/apk/debug/app-debug.apk avnc-3.3.1-ime-fix-debug.apk
          sha256sum avnc-3.3.1-ime-fix-debug.apk | tee avnc-3.3.1-ime-fix-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avnc-3.3.1-ime-fix-debug
          path: |
            avnc-3.3.1-ime-fix-debug.apk
            avnc-3.3.1-ime-fix-debug.apk.sha256
          if-no-files-found: error